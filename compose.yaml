services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/orders.db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be configured}"
    volumes:
      - orders_data:/data
    command:
      - /bin/sh
      - -ec
      - |
        python -m alembic upgrade head
        exec python -m uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  orders_data: